theme = 'ansi'
# theme = 'transparent'
# theme = 'ataraxia'
# theme = 'wolf-alabaster-dark'

[editor]
atomic-save               = true
auto-completion           = true
auto-info                 = true
bufferline                = 'multiple'
color-modes               = true
completion-replace        = true
completion-timeout        = 1000
completion-trigger-len    = 1
continue-comments         = false
cursorline                = true
default-yank-register     = '£'
editor-config             = false
gutters                   = [ 'diff', 'diagnostics', 'spacer', 'line-numbers', 'spacer' ]
idle-timeout              = 3000
insert-final-newline      = true
line-number               = 'relative'
popup-border              = 'all'
preview-completion-insert = true
scroll-lines              = 1
scrolloff                 = 0
shell                     = [ 'zsh', '-c' ]
true-color                = true
path-completion           = true


[editor.search]
smart-case  = true
wrap-around = true

[editor.workspace-trust]
level   = "servers"
prompt  = true
trusted = [ '*' ]

[editor.clipboard-provider.custom]
paste = { command = 'c' }
yank  = { command = 'p' }

[editor.auto-save]
after-delay.enable  = true
after-delay.timeout = 10000
focus-lost          = true

[editor.statusline]
center    = [ 'file-name' ]
left      = [ 'mode', 'spinner' ]
right     = [ 'diagnostics', 'selections', 'position', 'total-line-numbers', 'version-control' ]
separator = '-'

[editor.cursor-shape]
insert = 'bar'
normal = 'block'
select = 'underline'

[editor.file-picker]
git-ignore = true
hidden     = false
max-depth  = 3

[editor.soft-wrap]
enable = true


