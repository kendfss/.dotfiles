# needs
#   minor modes
#   passing args

# cleaning macro => ]s=<ret><home>fct=<right>&<A-;>
theme = 'transparent'

[editor]
shell                  = [ 'zsh', '-c' ]
line-number            = 'relative'
idle-timeout           = 3000
auto-completion        = true
auto-info              = true
scroll-lines           = 1
scrolloff              = 0
continue-comments      = false
atomic-save            = true
popup-border           = 'all'
completion-trigger-len = 0
completion-replace     = true
gutters                = [ 'diff', 'diagnostics', 'spacer', 'line-numbers', 'spacer' ]
color-modes            = true
bufferline             = 'multiple'
true-color             = true
default-yank-register  = '£'

[editor.workspace-trust]
level   = "servers"
prompt  = true
trusted = [ '*' ]

[editor.clipboard-provider.custom]
yank  = { command = 'p' }
paste = { command = 'c' }

[editor.auto-save]
focus-lost          = true
after-delay.enable  = true
after-delay.timeout = 3000

[editor.statusline]
left      = [ 'mode', 'spinner' ]
center    = [ 'file-name' ]
right     = [ 'diagnostics', 'selections', 'position', 'total-line-numbers', 'version-control' ]
separator = '-'

[editor.cursor-shape]
insert = 'bar'
normal = 'block'
select = 'underline'

[editor.file-picker]
hidden     = false
git-ignore = false
max-depth  = 3

[editor.soft-wrap]
enable = true

[keys.normal]
F           = ':format'
tab         = 'no_op'
z           = [ 'delete_char_forward', 'move_next_word_end', 'move_prev_word_start', 'delete_selection_noyank' ]
'%'         = 'match_brackets'
'A-/'       = 'toggle_comments'
'A-?'       = 'toggle_block_comments'
'|'         = { '\' = 'shell_keep_pipe', '|' = 'shell_pipe' }
'?'         = { '/' = 'shell_insert_output', '?' = 'shell_append_output' }
'!'         = 'shell_pipe_to'
'$'         = ':run-shell-command'
S-left      = 'goto_previous_buffer'
S-right     = 'goto_next_buffer'
'A-;'       = 'remove_primary_selection'
A-w         = ':w!'
A-S-w       = [ ':write-all!', ':write-all!', 'normal_mode' ]
A-c         = ':clipboard-yank'
A-r         = ':config-reload'
A-d         = [ 'save_selection', 'extend_line', 'yank', 'paste_after', 'move_line_up', 'jump_backward', 'move_line_down' ]
A-left      = 'move_prev_word_start'
A-right     = 'move_next_word_end'
A-S-left    = 'extend_to_line_start'
A-S-right   = 'extend_to_line_end'
A-up        = 'goto_prev_paragraph'
A-down      = 'goto_next_paragraph'
space       = { '%' = ':vsplit', '"' = ':hsplit', c = 'completion' }
f           = { c = 'find_next_char', t = 'find_till_char', C = 'find_prev_char', T = 'till_prev_char', f = 'file_picker', l = ':log-open', b = 'match_brackets', d = 'file_picker_in_current_buffer_directory' }
C-up        = 'half_page_up'
C-down      = 'half_page_down'
C-l         = 'split_selection_on_newline'
Z           = { Z = ':q!' }
0           = 'goto_line_start'
A-n         = ':new'
'ret'       = 'add_newline_below'
O           = [ 'add_newline_above', 'move_line_up' ]
'+'         = 'extend_search_next'
'minus'     = 'extend_search_prev'
A-del       = [ 'save_selection', 'collapse_selection', 'move_char_right', 'yank', 'delete_char_forward', 'move_char_left', 'jump_forward' ]
A-backspace = [ 'save_selection', 'collapse_selection', 'move_char_left', 'yank', 'move_char_right', 'delete_char_backward', 'jump_forward' ]
del         = [ 'save_selection', 'collapse_selection', 'move_char_right', 'delete_char_forward', 'move_char_left', 'jump_forward' ]
backspace   = [ 'save_selection', 'collapse_selection', 'delete_char_backward', 'jump_forward' ]
'#'         = { '#' = 'select_register', ret = 'insert_register', tab = 'copy_between_registers', backspace = ':clear-register' }
u           = [ 'save_selection', 'undo', 'jump_forward' ]
U           = [ 'save_selection', 'redo', 'jump_forward' ]
S-w         = ':write --no-format'

[keys.normal.w]
t     = 'transpose_view'
w     = ':write'
x     = ':wqa'
q     = { q = ':quit', a = ':quit-all' }
up    = 'jump_view_up'
down  = 'jump_view_down'
left  = 'jump_view_left'
right = 'jump_view_right'

[keys.normal.r]
r   = 'change_selection_noyank'
c   = 'replace'
'[' = 'surround_replace'
l   = [ 'extend_line', 'change_selection_noyank' ]
w   = [ 'move_next_word_end', 'move_prev_word_start', 'change_selection_noyank' ]

[keys.normal.c]
j = [ 'trim_selections', 'yank_joined_to_clipboard' ]
c = [ 'trim_selections', ':clipboard-yank' ]
a = [ 'save_selection', 'select_all', ':clipboard-yank', 'jump_backward' ]
t = [ 'find_till_char', 'change_selection_noyank' ]
T = [ 'till_prev_char', 'change_selection_noyank' ]
l = [ 'save_selection', 'extend_line', 'trim_selections', ':clipboard-yank', 'jump_backward' ]
x = { a = [ 'select_all', 'trim_selections', ':clipboard-yank', 'select_all', 'delete_selection_noyank' ], x = [ 'trim_selections', ':clipboard-yank', 'delete_selection_noyank' ], l = [ 'extend_line', 'trim_selections', ':clipboard-yank', 'delete_selection_noyank' ] }
d = ':yank-diagnostic'

[keys.normal.p]
P = [ 'save_selection', 'paste_before', 'jump_backward' ]
p = 'paste_before'
c = ':clipboard-paste-before'
o = { l = [ 'extend_line', 'delete_selection_noyank', 'paste_before' ], w = [ 'move_prev_word_start', 'extend_next_word_end', 'delete_selection_noyank', 'paste_before' ], c = ':clipboard-paste-replace', o = 'replace_with_yanked', t = [ 'trim_selections', 'delete_selection_noyank', ':insert-output tpb' ] }
a = { a = [ 'select_all', 'delete_selection_noyank', ':clipboard-paste-before' ], p = [ 'select_all', 'delete_selection_noyank', 'paste_before' ] }

[keys.normal.y]
j = [ 'save_selection', 'trim_selections', 'yank_joined', 'jump_backward' ]
y = 'yank'
c = [ 'trim_selections', 'yank' ]
a = [ 'save_selection', 'select_all', 'yank', 'jump_backward' ]
t = [ 'find_till_char', 'change_selection' ]
T = [ 'till_prev_char', 'change_selection' ]
l = [ 'save_selection', 'extend_line', 'yank', 'jump_backward' ]
d = ':yank-diagnostic £'


[keys.normal.x]
j = [ 'save_selection', 'trim_selections', 'yank_joined', 'delete_selection_noyank', 'jump_backward' ]
a = [ 'select_all', 'trim_selections', 'yank', 'select_all', 'delete_selection' ]
x = [ 'yank', 'delete_selection' ]
l = { l = [ 'extend_line', 'yank', 'delete_selection', 'move_line_up' ], t = [ 'extend_line', 'trim_selections', 'delete_selection' ] }

[keys.normal.l]
c   = 'completion'
o   = ':lsp-workspace-command'
h   = 'hover'
'?' = 'signature_help'
l   = [ ':lsp-restart', ':reload-all' ]
r   = 'rename_symbol'
b   = ':set-language bash'

[keys.normal.b]
right = 'goto_next_buffer'
left  = 'goto_previous_buffer'
b     = 'rotate_view'
space = 'buffer_picker'
c     = { o = ':buffer-close-others', c = ':buffer-close', a = ':buffer-close-all' }
h     = ':hsplit'
v     = ':vsplit'
p     = ':buffer-previous'
n     = ':buffer-next'
q     = ':quit'

[keys.normal.d]
a   = [ 'select_all', 'delete_selection_noyank' ]
e   = [ 'extend_next_word_end', 'delete_selection_noyank' ]
l   = [ 'extend_line', 'delete_selection_noyank', 'goto_line_end' ]
d   = 'delete_selection_noyank'
'w' = [ 'move_next_word_end', 'move_prev_word_start', 'delete_selection_noyank' ]
'W' = [ 'move_next_long_word_end', 'move_prev_long_word_start', 'delete_selection_noyank' ]

[keys.normal.s]
r     = [ 'delete_selection_noyank', 'paste_before' ]
right = 'extend_to_line_end'
left  = 'extend_to_line_start'
w     = [ 'move_prev_word_start', 'move_next_word_end' ]
l     = 'extend_line'
a     = 'select_all'
s     = 'select_regex'
c     = 'split_selection'
d     = 'delete_selection_noyank'
e     = { l = 'extend_to_line_end', w = 'extend_next_word_end' }
k     = 'keep_primary_selection'
t     = 'extend_till_char'
p     = 'extend_till_prev_char'
q     = [ 'collapse_selection', 'keep_primary_selection' ]

[keys.normal.j]
j = 'jumplist_picker'
f = 'jump_forward'
b = 'jump_backward'

[keys.normal.g]
f = { 'f' = 'goto_file', '-' = 'goto_file_hsplit', '\' = 'goto_file_vsplit', 'h' = 'goto_file_hsplit', 'v' = 'goto_file_vsplit' }

[keys.select]
'='    = { '=' = [ ':w!', 'normal_mode' ] }
'A-/'  = 'toggle_comments'
A-w    = [ ':w!', ':w!', 'normal_mode' ]
A-S-w  = [ ':write-all!', ':write-all!', 'normal_mode' ]
A-c    = ':clipboard-yank'
A-r    = ':config-reload'
space  = { '%' = ':vsplit', '"' = ':hsplit' }
C-l    = 'split_selection_on_newline'
A-n    = ':new'
'%'    = 'match_brackets'
A-up   = 'goto_prev_paragraph'
A-down = 'goto_next_paragraph'

[keys.select.d]
e   = [ 'extend_next_word_end', 'delete_selection_noyank' ]
l   = [ 'extend_line', 'delete_selection_noyank' ]
d   = 'delete_selection_noyank'
'c' = 'delete_char_forward'
'D' = 'delete_char_backward'
'w' = [ 'move_next_word_end', 'move_prev_word_start', 'delete_selection_noyank' ]
'W' = [ 'move_next_long_word_end', 'move_prev_long_word_start', 'delete_selection_noyank' ]

[keys.select.d.x]
w = [ 'move_next_word_end', 'move_prev_word_start', 'yank', 'delete_selection_noyank' ]
e = [ 'extend_next_word_end', 'delete_selection' ]
l = [ 'extend_line', 'delete_selection', 'move_line_up', 'goto_line_end' ]
d = 'delete_selection'

[keys.select.y]
c = ':clipboard-yank'
y = 'yank'
x = [ 'yank', 'delete_selection' ]
w = [ 'save_selection', 'move_prev_word_start', 'move_next_word_end', 'yank', 'jump_backward' ]
l = [ 'save_selection', 'extend_line', 'yank', 'jump_backward' ]
a = [ 'save_selection', 'select_all', 'yank', 'jump_backward' ]
s = ':clipboard-yank'
z = ':sh echo hello world'

[keys.select.l]
c   = 'completion'
o   = ':lsp-workspace-command'
h   = 'hover'
'?' = 'signature_help'
l   = [ ':reload-all', ':lsp-restart' ]
r   = 'rename_symbol'

[keys.select.c]
c = ':clipboard-yank'
p = 'paste_clipboard_before'
